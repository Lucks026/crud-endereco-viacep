<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="janela">
    <div class="janela-barra">
      <span class="bolinhas" aria-hidden="true">
        <span class="bolinha bolinha-vermelha"></span>
        <span class="bolinha bolinha-amarela"></span>
        <span class="bolinha bolinha-verde"></span>
      </span>
      <span id="caminho">~/clientes/novo</span>
    </div>

    <div class="janela-corpo">
      <header class="cabecalho">
        <h1>
          <span class="prompt" aria-hidden="true">~$</span>
          <span id="titulo">Novo cliente</span><span class="cursor" aria-hidden="true"></span>
        </h1>
      </header>

      <form id="formulario" novalidate autocomplete="off">
        <p class="nota">Campos com * são obrigatórios.</p>

        <fieldset>
          <legend><span class="prompt" aria-hidden="true">~$</span> Dados do Cliente</legend>

          <div class="linha">
            <div class="campo">
              <label for="nome">Nome <span aria-hidden="true">*</span></label>
              <input type="text" id="nome" name="nome" required aria-describedby="erro-nome">
              <p class="campo-erro" id="erro-nome"></p>
            </div>
          </div>

          <div class="linha linha-dupla">
            <div class="campo">
              <label for="email">E-mail <span aria-hidden="true">*</span></label>
              <input type="email" id="email" name="email" required aria-describedby="erro-email">
              <p class="campo-erro" id="erro-email"></p>
            </div>
            <div class="campo">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" inputmode="tel" aria-describedby="erro-telefone">
              <p class="campo-erro" id="erro-telefone"></p>
            </div>
          </div>

          <div class="linha linha-dupla">
            <div class="campo">
              <label for="cpf">CPF <span aria-hidden="true">*</span></label>
              <input type="text" id="cpf" name="cpf" inputmode="numeric" required aria-describedby="erro-cpf">
              <p class="campo-erro" id="erro-cpf"></p>
            </div>
            <div class="campo">
              <label for="dataNascimento">Data de nascimento</label>
              <input type="date" id="dataNascimento" name="dataNascimento" aria-describedby="erro-dataNascimento">
              <p class="campo-erro" id="erro-dataNascimento"></p>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend><span class="prompt" aria-hidden="true">~$</span> Endereço</legend>

          <div class="linha">
            <div class="campo">
              <label for="cep">CEP <span aria-hidden="true">*</span></label>
              <div class="campo-com-botao">
                <input type="text" id="cep" name="cep" inputmode="numeric" required aria-describedby="erro-cep">
                <button type="button" class="botao" id="botao-cep">Pesquisar CEP</button>
              </div>
              <p class="campo-erro" id="erro-cep" aria-live="polite"></p>
            </div>
          </div>

          <div class="linha linha-larga">
            <div class="campo">
              <label for="logradouro">Logradouro <span aria-hidden="true">*</span></label>
              <input type="text" id="logradouro" name="logradouro" required aria-describedby="erro-logradouro">
              <p class="campo-erro" id="erro-logradouro"></p>
            </div>
            <div class="campo">
              <label for="numero">Número <span aria-hidden="true">*</span></label>
              <input type="text" id="numero" name="numero" required aria-describedby="erro-numero">
              <p class="campo-erro" id="erro-numero"></p>
            </div>
          </div>

          <div class="linha linha-dupla">
            <div class="campo">
              <label for="complemento">Complemento</label>
              <input type="text" id="complemento" name="complemento" aria-describedby="erro-complemento">
              <p class="campo-erro" id="erro-complemento"></p>
            </div>
            <div class="campo">
              <label for="bairro">Bairro <span aria-hidden="true">*</span></label>
              <input type="text" id="bairro" name="bairro" required aria-describedby="erro-bairro">
              <p class="campo-erro" id="erro-bairro"></p>
            </div>
          </div>

          <div class="linha linha-larga">
            <div class="campo">
              <label for="cidade">Cidade <span aria-hidden="true">*</span></label>
              <input type="text" id="cidade" name="cidade" required aria-describedby="erro-cidade">
              <p class="campo-erro" id="erro-cidade"></p>
            </div>
            <div class="campo">
              <label for="uf">UF <span aria-hidden="true">*</span></label>
              <input type="text" class="caixa-alta" id="uf" name="uf" maxlength="2" required aria-describedby="erro-uf">
              <p class="campo-erro" id="erro-uf"></p>
            </div>
          </div>
        </fieldset>

        <button type="submit" class="botao botao-principal" id="botao-salvar">Salvar</button>
      </form>

      <p class="saida" id="mensagem" role="status"></p>
    </div>
  </main>

  <footer class="rodape">
    Lucas Lemos Barbosa · <a href="https://github.com/Lucks026">github.com/Lucks026</a>
  </footer>
</body>
</html>
