<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="janela">
    <div class="janela-barra">
      <span class="bolinhas" aria-hidden="true">
        <span class="bolinha bolinha-vermelha"></span>
        <span class="bolinha bolinha-amarela"></span>
        <span class="bolinha bolinha-verde"></span>
      </span>
      <span id="caminho">~/clientes/novo</span>
    </div>

    <div class="janela-corpo">
      <header class="cabecalho">
        <h1>
          <span class="prompt" aria-hidden="true">~$</span>
          <span id="titulo">Novo cliente</span><span class="cursor" aria-hidden="true"></span>
        </h1>
      </header>

      <form id="formulario" novalidate autocomplete="off">
        <p class="nota">Campos com * são obrigatórios.</p>

        <fieldset>
          <legend><span class="prompt" aria-hidden="true">~$</span> Dados do Cliente</legend>

          <div class="linha">
            <div class="campo">
              <label for="nome">Nome <span aria-hidden="true">*</span></label>
              <input type="text" id="nome" name="nome" required aria-describedby="erro-nome">
              <p class="campo-erro" id="erro-nome"></p>
            </div>
          </div>

          <div class="linha linha-dupla">
            <div class="campo">
              <label for="email">E-mail <span aria-hidden="true">*</span></label>
              <input type="email" id="email" name="email" required aria-describedby="erro-email">
              <p class="campo-erro" id="erro-email"></p>
            </div>
            <div class="campo">
              <label for="telefone">Telefone</label>
              <input type="tel" id="telefone" name="telefone" inputmode="tel" aria-describedby="erro-telefone">
              <p class="campo-erro" id="erro-telefone"></p>
            </div>
          </div>

          <div class="linha linha-dupla">
            <div class="campo">
              <label for="cpf">CPF <span aria-hidden="true">*</span></label>
              <input type="text" id="cpf" name="cpf" inputmode="numeric" required aria-describedby="erro-cpf">
              <p class="campo-erro" id="erro-cpf"></p>
            </div>
            <div class="campo">
              <label for="dataNascimento">Data de nascimento</label>
              <input type="date" id="dataNascimento" name="dataNascimento" aria-describedby="erro-dataNascimento">
              <p class="campo-erro" id="erro-dataNascimento"></p>
            </div>
          </div>
        </fieldset>
      </form>
    </div>
  </main>

  <footer class="rodape">
    Lucas Lemos Barbosa · <a href="https://github.com/Lucks026">github.com/Lucks026</a>
  </footer>
</body>
</html>
